name: Build and Deploy Reporting Service (BRAC)

on:
  push:
    branches:
      - brac-release-1.0.0

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/shiksha-lms-service
  IMAGE_TAG: ${{ github.sha }}


jobs:

  # ============================================================
  # BUILD + DEPLOY QA
  # ============================================================
  build-and-deploy-qa:
    name: Build and Deploy to QA
    runs-on: ubuntu-latest

    # All secrets below come from the "qa" environment
    environment:
      name: qa

    permissions:
      contents: read
      packages: write

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4


      # =========================
      # Generate 4-Character Image Tag
      # =========================
      - name: Generate Image Tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::4}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"

          echo "========================================="
          echo "Image Tag Generated"
          echo "========================================="
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Image Tag:  ${IMAGE_TAG}"


      # =========================
      # Login to GHCR
      # =========================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =========================
      # Setup Docker Buildx
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # =========================
      # Build & Push Multi-Arch Image
      # =========================
      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # =========================
      # Show Image Information
      # =========================
      - name: Show Image Information
        run: |
          echo "========================================="
          echo "Multi-architecture image built"
          echo "========================================="
          echo ""
          echo "Environment: QA"
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Image:"
          echo "${GHCR_IMAGE}:${IMAGE_TAG}"
          echo ""
          echo "Architectures:"
          echo "  - linux/amd64"
          echo "  - linux/arm64"


      # =========================
      # Deploy to QA Server
      # =========================
      - name: Deploy to QA Server
        uses: appleboy/ssh-action@master

        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          envs: GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -e

            echo "========================================="
            echo "Deploying BRAC Reporting Service"
            echo "Environment: QA"
            echo "Tag: ${IMAGE_TAG}"
            echo "========================================="

            cd "${{ secrets.TARGET_DIR }}"

            if [ -f .env ]; then
              cp .env .env-bkp
            fi

            cat << 'EOF' > .env
            ${{ secrets.ENV_BRAC }}
            EOF

            ./deploy.sh "${IMAGE_TAG}"


  # ============================================================
  # VALIDATE + DEPLOY PRODUCTION
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # All secrets below come from the "production" environment
    environment:
      name: production

    permissions:
      contents: read
      packages: read

    steps:

      # =========================
      # Generate 4-Character Image Tag
      # =========================
      - name: Generate Image Tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::4}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"

          echo "========================================="
          echo "Image Tag Generated"
          echo "========================================="
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Image Tag:  ${IMAGE_TAG}"


      # =========================
      # Login to GHCR
      # =========================
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # =========================
      # Validate Existing Image
      # =========================
      - name: Validate Image Exists in GHCR
        run: |
          set -e

          IMAGE="${GHCR_IMAGE}:${IMAGE_TAG}"

          echo "========================================="
          echo "Validating Production Image"
          echo "========================================="
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Image: ${IMAGE}"
          echo ""

          docker manifest inspect "${IMAGE}" > /dev/null

          echo ""
          echo "Image exists in GHCR."
          echo "No image will be built."
          echo "Production will deploy:"
          echo "${IMAGE}"


      # =========================
      # Deploy to Production Server
      # =========================
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master

        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}

        with:
          host: ${{ secrets.HOST_NAME }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG

          script: |
            set -e

            echo "========================================="
            echo "Deploying BRAC Reporting Service"
            echo "Environment: PRODUCTION"
            echo "Tag: ${IMAGE_TAG}"
            echo "========================================="

            cd "${{ secrets.TARGET_DIR }}"

            if [ -f .env ]; then
              cp .env .env-bkp
            fi

            cat << 'EOF' > .env
            ${{ secrets.ENV_BRAC }}
            EOF

            ./deploy.sh "${IMAGE_TAG}"

            echo "========================================="
            echo "Production deployment completed"
            echo "Tag: ${IMAGE_TAG}"
            echo "========================================="
